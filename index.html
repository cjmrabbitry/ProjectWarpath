<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainbows and Winnings</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1F2E29;
    --paper:#EEF0EA;
    --card:#FFFFFF;
    --line:rgba(31,46,41,0.13);
    --line-soft:rgba(31,46,41,0.07);
    --amber:#C97A2B;
    --amber-deep:#A85F1E;
    --amber-bg:#FBEEE0;
    --red:#B5462F;
    --red-bg:#F7E7E2;
    --green:#4C7A5E;
    --green-bg:#E6EEE8;
    --gold:#B08D1C;
    --gold-bg:#F5EED2;
    --muted:#5B6B62;
    --muted-2:#8C978F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;}
  #app{max-width:900px;margin:0 auto;padding-bottom:64px;}

  /* ---- Header ---- */
  header.top{
    padding:20px 16px 14px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky;top:0;z-index:20;
  }
  header.top .title-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  header.top h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-0.01em;color:var(--ink);}
  header.top .save-status{font-size:11.5px;color:var(--muted-2);white-space:nowrap;}
  header.top p.sub{margin:3px 0 0;color:var(--muted);font-size:13px;}

  nav.tabs{
    display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;
    border-bottom:1px solid var(--line);background:var(--paper);
    position:sticky;top:64px;z-index:19;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size:13.5px;font-weight:600;
    padding:9px 14px;border:none;background:none;
    color:var(--muted);cursor:pointer;
    border-bottom:2.5px solid transparent;
    margin-bottom:-1px;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--amber-deep);}

  #content{padding:16px;}

  /* ---- Generic ---- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .section-title{font-size:13px;font-weight:600;text-transform:none;color:var(--muted);margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .btn{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;font-size:13.5px;font-weight:600;
    padding:9px 14px;border-radius:7px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer;
  }
  .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn.amber{background:var(--amber);color:#fff;border-color:var(--amber);}
  .btn.danger{color:var(--red);border-color:var(--red);background:var(--red-bg);}
  .btn.ghost{background:none;border-color:transparent;color:var(--muted);}
  .btn.small{padding:6px 10px;font-size:12.5px;}
  .btn:active{transform:translateY(1px);}
  input,select,textarea{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;font-size:14px;color:var(--ink);
    padding:9px 10px;border:1px solid var(--line);border-radius:7px;
    background:#fff;width:100%;
  }
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px;}
  .field{margin-bottom:12px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* ---- Stat cards ---- */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;}
  .stat .num{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;font-size:26px;font-weight:700;line-height:1;}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:5px;}
  .stat.flag-red .num{color:var(--red);}
  .stat.flag-amber .num{color:var(--amber-deep);}

  /* ---- Badges ---- */
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .badge.Healthy{background:var(--green-bg);color:var(--green);}
  .badge.Renewal-Upcoming{background:var(--amber-bg);color:var(--amber-deep);}
  .badge.At-Risk{background:var(--red-bg);color:var(--red);}
  .badge.Opportunity{background:var(--gold-bg);color:var(--gold);}
  .badge.priority-High{background:#F3E4E4;color:#8C3B2E;}
  .badge.priority-Medium{background:#F0EADB;color:#8C6B1C;}
  .badge.priority-Low{background:#E7EBE6;color:#5B6B62;}
  .badge.vendor-CDK{background:var(--green-bg);color:var(--green);}
  .badge.vendor-Competitor{background:var(--red-bg);color:var(--red);}

  /* ---- Overview list rows ---- */
  .flist{display:flex;flex-direction:column;gap:8px;}
  .frow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    cursor:pointer;
  }
  .frow .fmain{min-width:0;}
  .frow .fname{font-weight:600;font-size:14px;}
  .frow .fmeta{font-size:12px;color:var(--muted);margin-top:2px;}
  .frow .fright{text-align:right;flex:0 0 auto;}
  .frow .fdays{font-size:12px;font-weight:600;color:var(--amber-deep);white-space:nowrap;}
  .empty{color:var(--muted-2);font-size:13px;padding:14px 2px;}

  /* ---- Accounts tab ---- */
  .filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{
    font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:20px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;
  }
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .acct-card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px 13px;margin-bottom:9px;
  }
  .acct-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .acct-name{font-weight:600;font-size:14.5px;}
  .acct-loc{font-size:12px;color:var(--muted);margin-top:1px;}
  .acct-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
  .acct-details{margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px;}
  .acct-actions{display:flex;gap:6px;margin-top:10px;}
  .tip-box{background:var(--amber-bg);border-radius:8px;padding:9px 11px;margin-top:9px;font-size:12.5px;color:#6B4A1E;}
  .tip-box b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.02em;color:var(--amber-deep);margin-bottom:3px;}

  /* ---- Territory tab ---- */
  .state-group{margin-bottom:18px;}
  .state-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
  .state-head h3{font-size:15px;margin:0;}
  .state-head span{font-size:12px;color:var(--muted-2);}
  .visit-row{
    background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;margin-bottom:7px;
  }
  .visit-row .vtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .visit-row .vname{font-weight:600;font-size:14px;}
  .visit-row .vmeta{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .visit-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px;}
  .visit-dates .field{margin-bottom:0;}
  .unscheduled{color:var(--amber-deep);font-weight:600;font-size:11px;}

  /* ---- Tasks tab ---- */
  .task-group{margin-bottom:16px;}
  .task-row{
    display:flex;align-items:flex-start;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;margin-bottom:7px;
  }
  .task-row.done{opacity:0.5;}
  .task-row input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;margin-top:1px;accent-color:var(--ink);}
  .task-main{flex:1;min-width:0;}
  .task-title{font-size:14px;font-weight:500;}
  .task-row.done .task-title{text-decoration:line-through;}
  .task-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .task-meta.overdue{color:var(--red);font-weight:600;}

  /* ---- Modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(31,46,41,0.42);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal{
    background:var(--paper);width:100%;max-width:900px;max-height:88vh;overflow-y:auto;
    border-radius:16px 16px 0 0;padding:18px 16px 26px;
  }
  @media(min-width:640px){
    .overlay{align-items:center;}
    .modal{border-radius:14px;max-height:80vh;}
  }
  .modal h2{font-size:17px;margin:0 0 14px;}
  .modal-close{position:sticky;top:0;text-align:right;margin-bottom:-6px;}

  .fab-add{
    width:100%;margin-top:4px;
  }
  .fab-capture{
    position:fixed;bottom:22px;right:20px;width:56px;height:56px;border-radius:50%;
    background:var(--amber);color:#fff;border:none;font-size:28px;line-height:1;
    box-shadow:0 4px 14px rgba(31,46,41,0.28);cursor:pointer;z-index:40;
    display:flex;align-items:center;justify-content:center;padding-bottom:3px;
  }
  .fab-capture:active{transform:scale(0.94);}
  a.linklike{color:var(--amber-deep);font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div style="padding:60px 20px;color:#5B6B62;font-size:14px;">Loading your dashboard…</div>
</div>

<script>
const STORAGE_KEY = 'territory-dashboard-v1';
const STATES = ['MD','DE','VA','PA','NJ'];
const STATUSES = ['Healthy','Renewal Upcoming','At Risk','Opportunity'];
const PRODUCT_CATEGORIES = ['DMS','CRM','Service','Other'];
const VENDORS = ['CDK','Competitor'];
const PRIORITIES = ['High','Medium','Low'];
const CSM_REQUEST_TYPES = ['CSS Case','Other'];
const DEPARTMENTS = ['Accounting','Sales','Service','Parts'];
const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const TIPS = {
  'Renewal Upcoming': ["Open the renewal conversation a year out — 6 months is the worst-case latest start.","Bring usage and ROI data from the current term into the conversation.","Ask what's frustrating them now, before it becomes a renewal objection."],
  'At Risk': ["Get face-to-face before you propose anything — don't negotiate over email first.","Pin down the actual trigger: price, service response time, or a competitor conversation.","Loop in your manager or a specialist early if the relationship has real strain."],
  'Opportunity': ["Anchor the pitch to a specific workflow gap this closes for them, not a feature list.","Bring a peer dealer's results or a short live demo instead of a deck.","Time the pitch to their renewal or budget cycle for easier approval."],
  'Healthy': ["Use the equity here to ask for a referral into another rooftop.","Check in on a light cadence even with nothing to sell — stay top of mind.","Look for one adjacent product that fits how they already work."]
};

let state = {
  data: { accounts: [], tasks: [], csms: [], csmRequests: [], settings: { homeBase: '' }, boyfriendSchedule: { workDays: [], overrides: [] }, initiatives: [] },
  ui: { tab: 'overview', search: '', filterStates: [], filterStatuses: [], modal: null, deleteConfirm: null,
    productSearch: '', filterProductCategories: [], filterProductVendors: [], filterRenewalSoon: false, filterStale: false, routeSelection: [],
    filterCsmStatus: 'Open', tripStart: null, tripNights: 1 }
};

function uid(){ return Math.random().toString(36).slice(2,10); }
function fmtDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function addDays(base,n){ const d=new Date(base); d.setDate(d.getDate()+n); return d; }
function today(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
function parseLocal(str){ return str ? new Date(str+'T00:00:00') : null; }
function daysUntil(str){ if(!str) return null; const diff = parseLocal(str) - today(); return Math.round(diff/86400000); }
function niceDate(str){
  if(!str) return '—';
  const d = parseLocal(str);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year: d.getFullYear()!==new Date().getFullYear() ? 'numeric' : undefined });
}
function daysLabel(str){
  const n = daysUntil(str);
  if(n===null) return '';
  if(n===0) return 'Today';
  if(n===1) return 'Tomorrow';
  if(n===-1) return '1 day overdue';
  if(n<0) return `${Math.abs(n)} days overdue`;
  return `in ${n} days`;
}
function slug(s){ return s.replace(/\s+/g,'-'); }
function monthsLabel(str){
  const d = daysUntil(str);
  if(d===null) return '';
  if(d<0) return daysLabel(str);
  if(d<60) return daysLabel(str);
  const months = Math.round(d/30.44);
  return `~${months} month${months===1?'':'s'} left`;
}
function lastVisitDate(a){
  const log = a.visitLog||[];
  if(!log.length) return null;
  return [...log].sort((x,y)=>y.date.localeCompare(x.date))[0].date;
}
function lastActivity(a){
  const log = a.visitLog||[];
  if(!log.length) return null;
  return [...log].sort((x,y)=>y.date.localeCompare(x.date))[0];
}
const STALE_DAYS = 90;
function isStale(a){
  const last = lastVisitDate(a);
  if(!last) return true;
  return daysUntil(last) <= -STALE_DAYS;
}
function mapsAddress(a){ return a.address ? a.address : `${a.city}, ${a.state}`; }
function mapsSingleUrl(a){ return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(mapsAddress(a))}`; }
function mapsRouteUrl(accounts){
  const home = state.data.settings && state.data.settings.homeBase;
  const stops = accounts.map(a=>mapsAddress(a));
  const full = home ? [home, ...stops, home] : stops;
  return `https://www.google.com/maps/dir/${full.map(encodeURIComponent).join('/')}`;
}
function nightStatus(dateStr){
  const sched = state.data.boyfriendSchedule || { workDays:[], overrides:[] };
  const override = sched.overrides.find(o=>o.date===dateStr);
  if(override) return { status: override.type, note: override.note||'', override };
  const dow = WEEKDAYS[parseLocal(dateStr).getDay()];
  return { status: sched.workDays.includes(dow) ? 'work' : 'clear', note:'', override:null };
}
function nightBadge(dateStr){
  const ns = nightStatus(dateStr);
  const map = {
    work: { cls:'At-Risk', label:"He's working — no override" },
    clear: { cls:'Healthy', label:'Clear' },
    sitter: { cls:'Healthy', label:'Sitter arranged' },
    off: { cls:'Healthy', label:'Marked off' },
  };
  const m = map[ns.status] || map.clear;
  return `<span class="badge ${m.cls}">${m.label}</span>`;
}

function seedData(){
  const emptyPlanning = () => ({ Accounting:{strengths:'',weaknesses:''}, Sales:{strengths:'',weaknesses:''}, Service:{strengths:'',weaknesses:''}, Parts:{strengths:'',weaknesses:''} });
  const acc = (o) => ({ id: uid(), address:'', nextVisit:null, notes:'', products:[], visitLog:[], marketing:[], csmId:null, planning: emptyPlanning(), parentGroupId:null, initiativesDiscussed:[], ...o });
  const t = today();
  const prod = (category,name,vendor) => ({ id: uid(), category, name, vendor });
  const visit = (date,notes,loggedMileage,type) => ({ id: uid(), date, type: type||'Visit', notes: notes||'', loggedMileage: !!loggedMileage });
  const mkt = (date,item) => ({ id: uid(), date, item });

  const csmJordan = { id: uid(), name:'Jordan Blake', email:'jordan.blake@cdk.com' };
  const csmPriya = { id: uid(), name:'Priya Nair', email:'priya.nair@cdk.com' };
  const csmMarcus = { id: uid(), name:'Marcus Webb', email:'marcus.webb@cdk.com' };
  const csmDana = { id: uid(), name:'Dana Sutton', email:'dana.sutton@cdk.com' };
  state.data.csms = [csmJordan, csmPriya, csmMarcus, csmDana];
  state.data.settings = { homeBase: '105 Oriole Lane, La Plata, MD' };
  state.data.boyfriendSchedule = { workDays: [], overrides: [] };
  const initServiceMktg = { id: uid(), title:'Service Marketing launch', description:'New add-on product — drives service-lane traffic with automated campaigns.' };
  const initCrmRenewal = { id: uid(), title:'CRM renewal push', description:'Q1 focus: get ahead of CRM contract renewals before they go to bid.' };
  state.data.initiatives = [initServiceMktg, initCrmRenewal];

  state.data.accounts = [
    acc({ name:'Crestline Ford', city:'Frederick', state:'MD', status:'Renewal Upcoming', priority:'High', renewalDate: fmtDate(addDays(t,18)), nextVisit: fmtDate(addDays(t,6)), notes:'Renewal conversation started. GM wants a pricing review before he signs.', csmId: csmJordan.id,
      planning: { Accounting:{strengths:'Pays on time, controller is engaged.', weaknesses:'Slow to approve new POs — 2-3 week lag.'},
                  Sales:{strengths:'Strong desk process, uses CRM daily.', weaknesses:''},
                  Service:{strengths:'New service director, receptive to training.', weaknesses:'Advisors skip CRM logging half the time.'},
                  Parts:{strengths:'', weaknesses:'Still on paper counter tickets.'} },
      visitLog:[ visit(fmtDate(addDays(t,-25)), 'Walked the lot, met the new service director.', true) ],
      marketing:[ mkt(fmtDate(addDays(t,-25)), 'Left CDK renewal savings one-pager with GM') ],
      initiativesDiscussed:[ { id: uid(), initiativeId: initServiceMktg.id, date: fmtDate(addDays(t,-25)), notes: 'GM interested, wants pricing.' } ],
      products:[ prod('DMS','CDK DMS','CDK'), prod('CRM','CDK CRM','CDK'), prod('Service','CDK Service','CDK') ] }),
    acc({ name:'Somerset Nissan', city:'Somerville', state:'NJ', status:'At Risk', priority:'High', renewalDate: fmtDate(addDays(t,22)), nextVisit: fmtDate(addDays(t,3)), notes:'Service manager complained about support response time twice this quarter.', csmId: csmPriya.id,
      visitLog:[ visit(fmtDate(addDays(t,-51)), 'Tense visit — service dept frustrated with ticket response time.', true), visit(fmtDate(addDays(t,-8)), 'Follow-up call — service manager says response times have improved.', false, 'Call') ],
      products:[ prod('DMS','CDK DMS','CDK'), prod('CRM','VinSolutions','Competitor'), prod('Service','CDK Service','CDK') ] }),
  ];
  const bayshoreGroup = acc({ name:'Bayshore Auto Group', city:'Ocean City', state:'MD', status:'At Risk', priority:'High', renewalDate: null, nextVisit: null, notes:'Ownership group — three rooftops. Owner mentioned a competitor demo last call.', csmId: csmPriya.id });
  state.data.accounts.push(bayshoreGroup);
  state.data.accounts.push(
    acc({ name:'Bayshore Chevrolet', city:'Ocean City', state:'MD', status:'At Risk', priority:'High', renewalDate: fmtDate(addDays(t,64)), nextVisit: null, notes:'Needs a visit booked.', csmId: csmPriya.id, parentGroupId: bayshoreGroup.id,
      visitLog:[ visit(fmtDate(addDays(t,-40)), '', true) ],
      products:[ prod('DMS','CDK DMS','CDK'), prod('CRM','DealerSocket','Competitor') ] }),
    acc({ name:'Bayshore Kia', city:'Ocean City', state:'MD', status:'Healthy', priority:'Medium', renewalDate: fmtDate(addDays(t,190)), nextVisit: null, notes:'', csmId: csmPriya.id, parentGroupId: bayshoreGroup.id,
      products:[ prod('DMS','CDK DMS','CDK'), prod('CRM','CDK CRM','CDK') ] })
  );
  state.data.accounts.push(
    acc({ name:'Wilmington Auto Mall', city:'Wilmington', state:'DE', status:'Opportunity', priority:'Medium', renewalDate: fmtDate(addDays(t,140)), nextVisit: fmtDate(addDays(t,20)), notes:'Good fit for Service Marketing add-on — bring the one-pager.', csmId: csmJordan.id,
      visitLog:[ visit(fmtDate(addDays(t,-14)), 'Dropped off Service Marketing brochure, GM said he\'d review with partners.', false) ],
      marketing:[ mkt(fmtDate(addDays(t,-14)), 'Service Marketing brochure') ],
      products:[ prod('DMS','Reynolds & Reynolds','Competitor'), prod('CRM','CDK CRM','CDK') ] }),
    acc({ name:'Keystone Toyota', city:'Harrisburg', state:'PA', status:'Renewal Upcoming', priority:'Medium', renewalDate: fmtDate(addDays(t,41)), nextVisit: fmtDate(addDays(t,15)), notes:'', csmId: csmMarcus.id,
      visitLog:[ visit(fmtDate(addDays(t,-70)), '', true) ],
      products:[ prod('DMS','CDK DMS','CDK'), prod('CRM','CDK CRM','CDK'), prod('Other','Website','Competitor') ] }),
    acc({ name:'Shore Motors CDJR', city:'Virginia Beach', state:'VA', status:'Healthy', priority:'Low', renewalDate: fmtDate(addDays(t,300)), nextVisit: null, notes:'Steady account. Worth a referral ask next visit.', csmId: csmDana.id,
      visitLog:[ visit(fmtDate(addDays(t,-30)), '', true) ],
      products:[ prod('DMS','CDK DMS','CDK'), prod('CRM','CDK CRM','CDK'), prod('Service','CDK Service','CDK') ] }),
    acc({ name:'Turnpike Honda Group', city:'Cherry Hill', state:'NJ', status:'Healthy', priority:'Low', renewalDate: fmtDate(addDays(t,210)), nextVisit: fmtDate(addDays(t,60)), notes:'', csmId: csmMarcus.id,
      visitLog:[ visit(fmtDate(addDays(t,-9)), '', true) ],
      products:[ prod('DMS','Reynolds & Reynolds','Competitor'), prod('CRM','Reynolds CRM','Competitor'), prod('Service','CDK Service','CDK') ] })
  );
  const findId = (name) => state.data.accounts.find(a=>a.name===name).id;

  state.data.csmRequests = [
    { id: uid(), accountId: findId('Crestline Ford'), csmId: csmJordan.id, type:'CSS Case', caseNumber:'CS-482910', description:'DMS reconciliation error on RO close — needs escalation.', requestedDate: fmtDate(addDays(t,-6)), status:'Open', completedDate:null, followUpDate: fmtDate(addDays(t,-1)) },
    { id: uid(), accountId: findId('Wilmington Auto Mall'), csmId: csmJordan.id, type:'CSS Case', caseNumber:'CS-483102', description:'Login access issue for new sales manager.', requestedDate: fmtDate(addDays(t,-2)), status:'Open', completedDate:null, followUpDate: fmtDate(addDays(t,3)) },
    { id: uid(), accountId: findId('Somerset Nissan'), csmId: csmPriya.id, type:'Other', caseNumber:'', description:'Set up new CRM automation workflow for service follow-ups.', requestedDate: fmtDate(addDays(t,-10)), status:'Completed', completedDate: fmtDate(addDays(t,-2)), followUpDate: null },

function downloadBackup(){
  clearTimeout(saveTimer);
  persistNow();
  const jsonStr = JSON.stringify(state.data, null, 2);
  const blob = new Blob([jsonStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'rainbows-and-winnings-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function restoreBackup(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!(parsed && Array.isArray(parsed.accounts) && Array.isArray(parsed.tasks))){
        state.ui.backupError = "That file doesn't look like a dashboard file.";
        state.ui.pendingRestore = null;
        render();
        return;
      }
      const currentTime = state.data.updatedAt ? new Date(state.data.updatedAt).getTime() : 0;
      const fileTime = parsed.updatedAt ? new Date(parsed.updatedAt).getTime() : 0;
      if(currentTime && fileTime && fileTime < currentTime){
        state.ui.pendingRestore = parsed;
        state.ui.backupError = null;
        render();
      } else {
        applyRestore(parsed);
      }
    }catch(err){
      state.ui.backupError = "Couldn't read that file.";
      render();
    }
  };
  reader.readAsText(file);
}
function applyRestore(parsed){
  state.data = parsed;
  persistNow();
  state.ui.modal = null;
  state.ui.pendingRestore = null;
  state.ui.backupError = null;
  render();
}

function focusScore(a){
  let score = 0;
  if(a.status==='At Risk') score += 300;
  if(a.priority==='High') score += 100;
  if(a.status==='Renewal Upcoming') score += 60;
  const d = daysUntil(a.renewalDate);
  if(d!==null) score += Math.max(0, 90-d);
  return score;
}
function weeklyContactStats(){
  const inWindow = (dateStr) => dateStr!=null && daysUntil(dateStr)!==null && daysUntil(dateStr)>=-7 && daysUntil(dateStr)<=0;
  const total = state.data.accounts.length;
  const contacted = state.data.accounts.filter(a=> (a.visitLog||[]).some(v=>inWindow(v.date)) );
  return { total, contacted: contacted.length };
}
function completedLast7Days(){
  return state.data.tasks.filter(t=>t.done && t.completedAt && daysUntil(t.completedAt)!==null && daysUntil(t.completedAt)>=-7 && daysUntil(t.completedAt)<=0).length;

function weekInReviewData(){
  const inWindow = (dateStr) => dateStr!=null && daysUntil(dateStr)!==null && daysUntil(dateStr)>=-7 && daysUntil(dateStr)<=0;
  const activities = [];
  state.data.accounts.forEach(a=>{
    (a.visitLog||[]).forEach(v=>{ if(inWindow(v.date)) activities.push({ account:a, ...v }); });
  });
  const visits = activities.filter(x=>x.type==='Visit').length;
  const calls = activities.filter(x=>x.type==='Call').length;
  const emails = activities.filter(x=>x.type==='Email').length;
  const uniqueAccountsTouched = new Set(activities.map(x=>x.account.id)).size;

  const tasksCompleted = state.data.tasks.filter(t=>t.done && inWindow(t.completedAt));

  const talkingPoints = [];
  state.data.accounts.forEach(a=>{
    (a.initiativesDiscussed||[]).forEach(e=>{
      if(inWindow(e.date)){
        const init = state.data.initiatives.find(i=>i.id===e.initiativeId);
        talkingPoints.push({ account:a, initiative: init });
      }
    });
  });

  const marketingSent = [];
  state.data.accounts.forEach(a=>{
    (a.marketing||[]).forEach(m=>{ if(inWindow(m.date)) marketingSent.push({ account:a, ...m }); });
  });

  const atRiskAccounts = state.data.accounts.filter(a=>a.status==='At Risk');
  const atRiskContacted = atRiskAccounts.filter(a=> (a.visitLog||[]).some(v=>inWindow(v.date)) );

  return { activities, visits, calls, emails, uniqueAccountsTouched, tasksCompleted, talkingPoints, marketingSent,
    atRiskTotal: atRiskAccounts.length, atRiskContactedCount: atRiskContacted.length };
}

    items.push({ score: 900+days, icon:'📞', label: `Follow up with ${csmName(r.csmId)}`, sub: (acc?acc.name+' · ':'')+`${days} day${days===1?'':'s'} overdue`, type:'csm' });

    items.push({ score: 800, icon:'✅', label: t.title, sub: 'Due today', type:'task' });
  });
  state.data.accounts.forEach(a=>{
    if(isStale(a)){
      const d = daysUntil(a.renewalDate);
      const urgent = a.status==='At Risk' || (d!==null && d>=0 && d<=30);
      items.push({ score: urgent?700:500, icon:'📵', label: a.name, sub: `No contact ${STALE_DAYS}+ days`+(urgent?' · needs attention':''), type:'account', id:a.id });
    }
  });
  state.data.accounts.forEach(a=>{
    const d = daysUntil(a.renewalDate);
    if(d!==null && d>=0 && d<=180 && (a.status==='Healthy' || a.status==='Opportunity')){

  });

const CSV_COLUMNS = ['Name','City','State','Address','Status','Priority','Renewal Date','CSM','Notes'];
function csvEscape(val){
  const s = (val==null ? '' : String(val));
  return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}
function accountsToCsv(){
  const rows = [CSV_COLUMNS.join(',')];
  state.data.accounts.forEach(a=>{
    rows.push([a.name, a.city, a.state, a.address||'', a.status, a.priority, a.renewalDate||'', csmName(a.csmId), a.notes||''].map(csvEscape).join(','));
  });
  return rows.join('\n');
}
function exportAccountsCsv(){
  const csv = accountsToCsv();
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'accounts.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; }
      } else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n' || c==='\r'){
        if(c==='\r' && text[i+1]==='\n') i++;
        row.push(field); field='';
        if(row.length>1 || row[0]!==''){ rows.push(row); }
        row = [];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).map(r=>{
    const obj = {};
    headers.forEach((h,i)=> obj[h] = (r[i]||'').trim());
    return obj;
  });
}

function handleCsvFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => { document.getElementById('csvPasteArea').value = e.target.result; previewCsvFromTextarea(); };
  reader.readAsText(file);

function previewCsvFromTextarea(){
  const text = document.getElementById('csvPasteArea').value;
  if(!text.trim()){ state.ui.csvError = 'Paste or upload some CSV first.'; state.ui.csvPreview=null; render(); return; }
  const rows = parseCsv(text);
  const named = rows.filter(r=>r.name);
  if(!named.length){ state.ui.csvError = "Couldn't find a Name column with values."; state.ui.csvPreview=null; render(); return; }
  named.forEach(r=>{ r._existing = !!state.data.accounts.find(a=>a.name.toLowerCase()===r.name.toLowerCase()); });

  state.ui.csvPreview = named;
  render();

    else { state.data.accounts.push({ id: uid(), address:'', nextVisit:null, notes:'', products:[], visitLog:[], marketing:[], csmId:null, planning:{}, ...fields }); }

function buildAccountSummary(a){
  const d = daysUntil(a.renewalDate);
  const lastAct = lastActivity(a);
  const lines = [];
  lines.push(`${a.name} — ${a.city}, ${a.state}`);
  lines.push(`Status: ${a.status} (${a.priority} priority) · CSM: ${csmName(a.csmId)}`);
  lines.push(`Renewal: ${a.renewalDate ? niceDate(a.renewalDate) + (d!==null?' ('+monthsLabel(a.renewalDate)+')':'') : 'Not set'}`);
  lines.push('');
  if((a.products||[]).length){
    lines.push('Products:');
    a.products.forEach(p=> lines.push(`- ${p.category}: ${p.name} (${p.vendor==='CDK'?'Ours':'Competitor'})`));
    lines.push('');
  }
  lines.push(`Last activity: ${lastAct ? niceDate(lastAct.date)+' ('+(lastAct.type||'Visit')+')'+(lastAct.notes?' — '+lastAct.notes:'') : 'None logged'}`);
  lines.push(`Next visit: ${niceDate(a.nextVisit)}`);
  if(a.notes){ lines.push(''); lines.push(`Notes: ${a.notes}`); }
  const planned = a.planning ? DEPARTMENTS.filter(dep=>a.planning[dep] && (a.planning[dep].strengths||a.planning[dep].weaknesses)) : [];
  if(planned.length){
    lines.push('');
    lines.push('Account planning:');
    planned.forEach(dep=>{
      const p = a.planning[dep];
      const parts = [];
      if(p.strengths) parts.push('Strengths: '+p.strengths);
      if(p.weaknesses) parts.push('Weaknesses: '+p.weaknesses);
      lines.push(`${dep} — ${parts.join(' | ')}`);
    });
  }
  const undiscussed = undiscussedInitiatives(a);
  if(undiscussed.length){
    lines.push('');
    lines.push('Talk about next: ' + undiscussed.map(i=>i.title).join(', '));
  }
  return lines.join('\n');
}

function nearbySuggestionsHTML(selAccounts){
  if(!selAccounts.length) return '';
  const selIds = new Set(selAccounts.map(a=>a.id));
  const selCities = new Set(selAccounts.map(a=>a.city.toLowerCase()));
  const selStates = new Set(selAccounts.map(a=>a.state));
  const candidates = state.data.accounts.filter(a=>{
    if(selIds.has(a.id)) return false;
    return selCities.has(a.city.toLowerCase()) || selStates.has(a.state);
  }).map(a=>({ a, sameCity: selCities.has(a.city.toLowerCase()) }))
    .sort((x,y)=> (y.sameCity - x.sameCity))
    .slice(0,8);
  if(!candidates.length) return '';
  return `
    <div class="section-title">On the way — worth adding?</div>
    <div class="flist" style="margin-bottom:10px;">
      ${candidates.map(({a,sameCity})=>`
        <div class="frow">
          <div class="fmain">
            <div class="fname">${esc(a.name)}</div>
            <div class="fmeta">${a.city}, ${a.state} · ${sameCity?'same city':'same state'}</div>

          <button class="btn small" onclick="toggleRouteSelection('${a.id}')">+ Add</button>
        </div>
      `).join('')}
    </div>
  `;
}
function toggleRouteSelection(id){

  render();
}
function visitRow(a){

function logVisitToday(id){

function setTripStart(val){ state.ui.tripStart = val || null; renderTripNights(); }
function setTripNights(val){ state.ui.tripNights = Math.max(1, Math.min(14, parseInt(val,10)||1)); renderTripNights(); }
function tripNightDates(){
  if(!state.ui.tripStart) return [];
  const n = state.ui.tripNights || 1;
  const out = [];
  for(let i=0;i<n;i++){ out.push(fmtDate(addDays(parseLocal(state.ui.tripStart), i))); }
  return out;
}
function renderTripNights(){
  const c = document.getElementById('tripNightsContainer');
  if(!c) return;

  c.innerHTML = dates.map(dateStr=>{

    return `<div class="visit-row" style="margin-bottom:6px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">

function quickOverride(dateStr, type){
  const existing = state.data.boyfriendSchedule.overrides.find(o=>o.date===dateStr);

  else { state.data.boyfriendSchedule.overrides.push({ date: dateStr, type, note:'' }); }

    };

}

  return `

function onProductSearchInput(e){ state.ui.productSearch = e.target.value; renderProductsReport(); }
function toggleProductCategoryFilter(c){

function toggleProductVendorFilter(v){
  if(v==='All'){ state.ui.filterProductVendors = []; }
  else {
    const i = state.ui.filterProductVendors.indexOf(v);
    if(i>=0) state.ui.filterProductVendors.splice(i,1); else state.ui.filterProductVendors.push(v);
  }
  renderProductsReport();

function filteredProductRows(){
  const q = state.ui.productSearch.trim().toLowerCase();
  return allProductRows().filter(r=>{

    if(state.ui.filterProductVendors.length && !state.ui.filterProductVendors.includes(r.product.vendor)) return false;
    if(q && !(r.product.name.toLowerCase().includes(q) || r.account.name.toLowerCase().includes(q))) return false;

/* ================= TASKS ================= */
function tasksHTML(){
  const open = state.data.tasks.filter(t=>!t.done);
  const doneAll = state.data.tasks.filter(t=>t.done).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));
  const needsLog = doneAll.filter(t=>!t.loggedToSF);
  const logged = doneAll.filter(t=>t.loggedToSF);
  const overdue = open.filter(t=>daysUntil(t.dueDate)!==null && daysUntil(t.dueDate)<0).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const soon = open.filter(t=>daysUntil(t.dueDate)!==null && daysUntil(t.dueDate)>=0 && daysUntil(t.dueDate)<=7).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const later = open.filter(t=>t.dueDate==null || daysUntil(t.dueDate)>7).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));

  return `
    <button class="btn primary fab-add" onclick="openTaskModal('new')">+ Add task</button>
    ${taskGroup('Overdue', overdue)}
    ${taskGroup('Due this week', soon)}
    ${taskGroup('Later', later)}
    ${needsLog.length? `
      <div class="task-group">
        <div class="section-title">Completed — log in Salesforce (${needsLog.length})</div>
        ${needsLog.map(t=>taskRow(t)).join('')}
      </div>
    `: ''}
    ${logged.length? `
      <div class="task-group">
        <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
          <span>Logged to Salesforce (${logged.length})</span>
          <a class="linklike" style="font-size:12px;" onclick="confirmDelete('clearCompleted','all')">${state.ui.deleteConfirm && state.ui.deleteConfirm.id==='all' ? 'Tap again to clear':'Clear these'}</a>
        </div>
        ${logged.map(t=>taskRow(t)).join('')}
      </div>
    `: ''}
  `;
}
function taskGroup(title, list){
  if(!list.length) return '';
  return `<div class="task-group">
    <div class="section-title">${title}</div>
    ${list.map(t=>taskRow(t)).join('')}
  </div>`;
}
function taskRow(t){
  const acc = t.accountId? getAccount(t.accountId): null;
  const overdue = !t.done && daysUntil(t.dueDate)<0;
  const meta = t.done
    ? `${acc? esc(acc.name)+' · ':''}Completed ${t.completedAt? niceDate(t.completedAt) : '— date not recorded'}`
    : `${acc? esc(acc.name)+' · ':''}${t.dueDate? niceDate(t.dueDate)+' · '+daysLabel(t.dueDate) : 'No due date'} · ${t.priority}`;
  const sfToggle = t.done ? `
    <label style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);margin-top:5px;" onclick="event.stopPropagation();">
      <input type="checkbox" style="width:14px;height:14px;accent-color:var(--amber-deep);" ${t.loggedToSF?'checked':''} onchange="toggleLoggedSF('${t.id}')" />
      Logged to Salesforce
    </label>` : '';
  const snoozeRow = overdue ? `
    <div style="display:flex;gap:5px;margin-top:6px;" onclick="event.stopPropagation();">
      <button class="btn ghost small" onclick="snoozeTask('${t.id}',1)">Snooze 1 day</button>
      <button class="btn ghost small" onclick="snoozeTask('${t.id}',3)">3 days</button>
      <button class="btn ghost small" onclick="snoozeTask('${t.id}',7)">1 week</button>
    </div>` : '';
  return `<div class="task-row ${t.done?'done':''}">
    <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')" />
    <div class="task-main" onclick="openTaskModal('${t.id}')">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-meta ${overdue?'overdue':''}">${meta}</div>
      ${sfToggle}
      ${snoozeRow}
    </div>
    <button class="btn ghost small" onclick="confirmDelete('task','${t.id}')">${state.ui.deleteConfirm && state.ui.deleteConfirm.id===t.id ? 'Confirm?':'✕'}</button>
  </div>`;
}
function snoozeTask(id, days){
  const t = state.data.tasks.find(x=>x.id===id);
  if(!t) return;
  t.dueDate = fmtDate(addDays(today(), days));
  save();
  render();
}
function toggleTask(id){
  const t = state.data.tasks.find(x=>x.id===id);
  t.done = !t.done;
  t.completedAt = t.done ? fmtDate(today()) : null;
  if(!t.done) t.loggedToSF = false;
  save(); render();
}
function toggleLoggedSF(id){
  const t = state.data.tasks.find(x=>x.id===id);
  t.loggedToSF = !t.loggedToSF;
  save(); render();
}

/* ================= DELETE CONFIRM (no native dialogs) ================= */
function confirmDelete(type,id){
  if(state.ui.deleteConfirm && state.ui.deleteConfirm.type===type && state.ui.deleteConfirm.id===id){
    if(type==='account'){
      state.data.accounts.forEach(a=>{ if(a.parentGroupId===id) a.parentGroupId=null; });
      state.data.accounts = state.data.accounts.filter(a=>a.id!==id);
    }
    if(type==='task') state.data.tasks = state.data.tasks.filter(t=>t.id!==id);
    if(type==='clearCompleted') state.data.tasks = state.data.tasks.filter(t=>!t.done);
    if(type==='csm'){
      state.data.csms = state.data.csms.filter(c=>c.id!==id);
      state.data.accounts.forEach(a=>{ if(a.csmId===id) a.csmId=null; });
      state.ui.modal = null;
    }
    if(type==='csmRequest'){ state.data.csmRequests = state.data.csmRequests.filter(r=>r.id!==id); state.ui.modal = null; }
    state.ui.deleteConfirm = null;
    save(); render();
  } else {
    state.ui.deleteConfirm = {type,id};
    if(type==='account') renderAccountsList(); else render();
    setTimeout(()=>{ if(state.ui.deleteConfirm && state.ui.deleteConfirm.id===id){ state.ui.deleteConfirm=null; if(type==='account') renderAccountsList(); else render(); } }, 3000);
  }
}

}
function marketingListEditorHTML(){
  if(!editingMarketing.length) return `<div class="empty" style="padding:4px 0;">Nothing logged yet.</div>`;
  return [...editingMarketing].sort((a,b)=>b.date.localeCompare(a.date)).map((m)=>{
    const i = editingMarketing.indexOf(m);
    return `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-soft);">
      <div style="font-size:13px;">${esc(m.item)} <span style="color:var(--muted-2);font-size:11.5px;">· ${niceDate(m.date)}</span></div>
      <button type="button" class="btn ghost small" onclick="removeEditingMarketing(${i})">✕</button>
    </div>
  `;}).join('');
}
function addEditingMarketing(){
  const date = document.getElementById('nm_date').value || fmtDate(today());
  const item = document.getElementById('nm_item').value.trim();
  if(!item) return;
  editingMarketing.push({ id: uid(), date, item });
  document.getElementById('nm_item').value = '';
  document.getElementById('marketingListEditor').innerHTML = marketingListEditorHTML();
}
function removeEditingMarketing(i){
  editingMarketing.splice(i,1);
  document.getElementById('marketingListEditor').innerHTML = marketingListEditorHTML();
}
function initiativesEditorHTML(){
  if(!state.data.initiatives.length) return `<div class="empty" style="padding:4px 0;">No initiatives set up yet — add some in Settings.</div>`;
  return state.data.initiatives.map(init=>{
    const entry = editingInitiatives.find(e=>e.initiativeId===init.id);
    return `<div style="padding:8px 0;border-bottom:1px solid var(--line-soft);">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" ${entry?'checked':''} onchange="toggleInitiativeDiscussed('${init.id}')" />
        <span style="font-weight:600;font-size:13px;">${esc(init.title)}</span>
      </label>
      ${init.description? `<div style="font-size:12px;color:var(--muted);margin:2px 0 0 26px;">${esc(init.description)}</div>`:''}
      ${entry ? `
        <div style="margin-left:26px;margin-top:6px;display:flex;gap:8px;">
          <input type="date" value="${entry.date}" onchange="updateInitiativeDate('${init.id}', this.value)" style="max-width:150px;" />
          <input placeholder="Notes" value="${esc(entry.notes||'')}" onchange="updateInitiativeNote('${init.id}', this.value)" />
        </div>
      ` : ''}
    </div>`;
  }).join('');
}
function toggleInitiativeDiscussed(initiativeId){
  const i = editingInitiatives.findIndex(e=>e.initiativeId===initiativeId);
  if(i>=0) editingInitiatives.splice(i,1);
  else editingInitiatives.push({ id: uid(), initiativeId, date: fmtDate(today()), notes:'' });
  document.getElementById('initiativesEditor').innerHTML = initiativesEditorHTML();
}
function updateInitiativeDate(initiativeId, val){
  const e = editingInitiatives.find(e=>e.initiativeId===initiativeId);
  if(e) e.date = val;
}
function updateInitiativeNote(initiativeId, val){
  const e = editingInitiatives.find(e=>e.initiativeId===initiativeId);
  if(e) e.notes = val;
}
function removeEditingProduct(i){
  editingProducts.splice(i,1);
  document.getElementById('productsListEditor').innerHTML = productsListEditorHTML();
}
function saveAccountForm(id){
  const planning = {};
  DEPARTMENTS.forEach(dept=>{
    planning[dept] = {
      strengths: document.getElementById(`f_plan_${dept}_s`).value.trim(),
      weaknesses: document.getElementById(`f_plan_${dept}_w`).value.trim(),
    };
  });
  const vals = {
    name: document.getElementById('f_name').value.trim(),
    city: document.getElementById('f_city').value.trim(),
    state: document.getElementById('f_state').value,
    address: document.getElementById('f_address').value.trim(),
    csmId: document.getElementById('f_csm').value || null,
    parentGroupId: document.getElementById('f_parentGroup').value || null,
    status: document.getElementById('f_status').value,
    priority: document.getElementById('f_priority').value,
    renewalDate: document.getElementById('f_renewal').value || null,
    nextVisit: document.getElementById('f_next').value || null,
    notes: document.getElementById('f_notes').value.trim(),
    products: editingProducts,
    visitLog: editingVisits,
    marketing: editingMarketing,
    initiativesDiscussed: editingInitiatives,
    planning: planning,
  };
  if(!vals.name){ document.getElementById('f_name').style.borderColor = 'var(--red)'; return; }
  if(id==='new'){
    state.data.accounts.push({ id: uid(), ...vals });
  } else {
    Object.assign(getAccount(id), vals);
  }
  save();
  state.ui.modal = null;
  render();
}
function taskModal(){
  const isNew = state.ui.modal.id==='new';
  const t = isNew ? { title:'', accountId:'', dueDate: fmtDate(addDays(today(),1)), priority:'Medium', done:false } : state.data.tasks.find(x=>x.id===state.ui.modal.id);
  return `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-close"><button class="btn ghost small" onclick="closeModal()">Close ✕</button></div>
      <h2>${isNew?'Add task':'Edit task'}</h2>
      <div class="field"><label>Task</label><input id="t_title" value="${esc(t.title)}" data-autofocus /></div>
      <div class="field"><label>Related account (optional)</label>
        <select id="t_account"><option value="">— None —</option>${state.data.accounts.map(a=>`<option value="${a.id}" ${t.accountId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
      </div>
      <div class="row2">
        <div class="field"><label>Due date</label><input type="date" id="t_due" value="${t.dueDate||''}" /></div>
        <div class="field"><label>Priority</label><select id="t_priority">${PRIORITIES.map(p=>`<option ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>
      </div>
      <button class="btn primary fab-add" onclick="saveTaskForm('${isNew?'new':t.id}')">Save task</button>
    </div>
  </div>`;
}
function saveTaskForm(id){
  const vals = {
    title: document.getElementById('t_title').value.trim(),
    accountId: document.getElementById('t_account').value || null,
    dueDate: document.getElementById('t_due').value || null,
    priority: document.getElementById('t_priority').value,
  };
  if(!vals.title){ document.getElementById('t_title').style.borderColor='var(--red)'; return; }
  if(id==='new'){
    state.data.tasks.push({ id: uid(), done:false, loggedToSF:false, ...vals });
  } else {
    Object.assign(state.data.tasks.find(x=>x.id===id), vals);
  }
  save();
  state.ui.modal = null;
  render();
}

function esc(s){ const d=document.createElement('div'); d.textContent = s==null? '' : s; return d.innerHTML; }

load();
</script>
</body>
</html>
