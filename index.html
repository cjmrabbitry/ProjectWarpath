<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warpath</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1F2E29;
    --paper:#EEF0EA;
    --card:#FFFFFF;
    --line:rgba(31,46,41,0.13);
    --line-soft:rgba(31,46,41,0.07);
    --amber:#C97A2B;
    --amber-deep:#A85F1E;
    --amber-bg:#FBEEE0;
    --red:#B5462F;
    --red-bg:#F7E7E2;
    --green:#4C7A5E;
    --green-bg:#E6EEE8;
    --gold:#B08D1C;
    --gold-bg:#F5EED2;
    --muted:#5B6B62;
    --muted-2:#8C978F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;}
  #app{max-width:900px;margin:0 auto;padding-bottom:64px;}

  /* ---- Header ---- */
  header.top{
    padding:20px 16px 14px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky;top:0;z-index:20;
  }
  header.top .title-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  header.top h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-0.01em;color:var(--ink);}
  header.top .save-status{font-size:11.5px;color:var(--muted-2);white-space:nowrap;}
  header.top p.sub{margin:3px 0 0;color:var(--muted);font-size:13px;}

  nav.tabs{
    display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;
    border-bottom:1px solid var(--line);background:var(--paper);
    position:sticky;top:64px;z-index:19;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size:13.5px;font-weight:600;
    padding:9px 14px;border:none;background:none;
    color:var(--muted);cursor:pointer;
    border-bottom:2.5px solid transparent;
    margin-bottom:-1px;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--amber-deep);}

  #content{padding:16px;}

  /* ---- Generic ---- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .section-title{font-size:13px;font-weight:600;text-transform:none;color:var(--muted);margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .btn{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;font-size:13.5px;font-weight:600;
    padding:9px 14px;border-radius:7px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer;
  }
  .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn.amber{background:var(--amber);color:#fff;border-color:var(--amber);}
  .btn.danger{color:var(--red);border-color:var(--red);background:var(--red-bg);}
  .btn.ghost{background:none;border-color:transparent;color:var(--muted);}
  .btn.small{padding:6px 10px;font-size:12.5px;}
  .btn:active{transform:translateY(1px);}
  input,select,textarea{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;font-size:14px;color:var(--ink);
    padding:9px 10px;border:1px solid var(--line);border-radius:7px;
    background:#fff;width:100%;
  }
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px;}
  .field{margin-bottom:12px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* ---- Stat cards ---- */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;}
  .stat .num{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;font-size:26px;font-weight:700;line-height:1;}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:5px;}
  .stat.flag-red .num{color:var(--red);}
  .stat.flag-amber .num{color:var(--amber-deep);}

  /* ---- Badges ---- */
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .badge.Healthy{background:var(--green-bg);color:var(--green);}
  .badge.Renewal-Upcoming{background:var(--amber-bg);color:var(--amber-deep);}
  .badge.At-Risk{background:var(--red-bg);color:var(--red);}
  .badge.Opportunity{background:var(--gold-bg);color:var(--gold);}
  .badge.priority-High{background:#F3E4E4;color:#8C3B2E;}
  .badge.priority-Medium{background:#F0EADB;color:#8C6B1C;}
  .badge.priority-Low{background:#E7EBE6;color:#5B6B62;}
  .badge.vendor-CDK{background:var(--green-bg);color:var(--green);}
  .badge.vendor-Competitor{background:var(--red-bg);color:var(--red);}

  /* ---- Overview list rows ---- */
  .flist{display:flex;flex-direction:column;gap:8px;}
  .frow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    cursor:pointer;
  }
  .frow .fmain{min-width:0;}
  .frow .fname{font-weight:600;font-size:14px;}
  .frow .fmeta{font-size:12px;color:var(--muted);margin-top:2px;}
  .frow .fright{text-align:right;flex:0 0 auto;}
  .frow .fdays{font-size:12px;font-weight:600;color:var(--amber-deep);white-space:nowrap;}
  .empty{color:var(--muted-2);font-size:13px;padding:14px 2px;}

  /* ---- Accounts tab ---- */
  .filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{
    font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:20px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;
  }
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .acct-card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px 13px;margin-bottom:9px;
  }
  .acct-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .acct-name{font-weight:600;font-size:14.5px;}
  .acct-loc{font-size:12px;color:var(--muted);margin-top:1px;}
  .acct-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
  .acct-details{margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px;}
  .acct-actions{display:flex;gap:6px;margin-top:10px;}
  .tip-box{background:var(--amber-bg);border-radius:8px;padding:9px 11px;margin-top:9px;font-size:12.5px;color:#6B4A1E;}
  .tip-box b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.02em;color:var(--amber-deep);margin-bottom:3px;}

  /* ---- Territory tab ---- */
  .state-group{margin-bottom:18px;}
  .state-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
  .state-head h3{font-size:15px;margin:0;}
  .state-head span{font-size:12px;color:var(--muted-2);}
  .visit-row{
    background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;margin-bottom:7px;
  }
  .visit-row .vtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .visit-row .vname{font-weight:600;font-size:14px;}
  .visit-row .vmeta{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .visit-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px;}
  .visit-dates .field{margin-bottom:0;}
  .unscheduled{color:var(--amber-deep);font-weight:600;font-size:11px;}

  /* ---- Tasks tab ---- */
  .task-group{margin-bottom:16px;}
  .task-row{
    display:flex;align-items:flex-start;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;margin-bottom:7px;
  }
  .task-row.done{opacity:0.5;}
  .task-row input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;margin-top:1px;accent-color:var(--ink);}
  .task-main{flex:1;min-width:0;}
  .task-title{font-size:14px;font-weight:500;}
  .task-row.done .task-title{text-decoration:line-through;}
  .task-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .task-meta.overdue{color:var(--red);font-weight:600;}

  /* ---- Modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(31,46,41,0.42);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal{
    background:var(--paper);width:100%;max-width:900px;max-height:88vh;overflow-y:auto;
    border-radius:16px 16px 0 0;padding:18px 16px 26px;
  }
  @media(min-width:640px){
    .overlay{align-items:center;}
    .modal{border-radius:14px;max-height:80vh;}
  }
  .modal h2{font-size:17px;margin:0 0 14px;}
  .modal-close{position:sticky;top:0;text-align:right;margin-bottom:-6px;}

  .fab-add{
    width:100%;margin-top:4px;
  }
  a.linklike{color:var(--amber-deep);font-weight:600;cursor:pointer;}
</style>
</head>

function uid(){ return Math.random().toString(36).slice(2,10); }
function fmtDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function addDays(base,n){ const d=new Date(base); d.setDate(d.getDate()+n); return d; }
function today(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
function parseLocal(str){ return str ? new Date(str+'T00:00:00') : null; }
function daysUntil(str){ if(!str) return null; const diff = parseLocal(str) - today(); return Math.round(diff/86400000); }
function niceDate(str){
  if(!str) return '—';
  const d = parseLocal(str);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year: d.getFullYear()!==new Date().getFullYear() ? 'numeric' : undefined });
}
function daysLabel(str){
  const n = daysUntil(str);
  if(n===null) return '';
  if(n===0) return 'Today';
  if(n===1) return 'Tomorrow';
  if(n===-1) return '1 day overdue';
  if(n<0) return `${Math.abs(n)} days overdue`;
  return `in ${n} days`;
}
function slug(s){ return s.replace(/\s+/g,'-'); }
function monthsLabel(str){
  const d = daysUntil(str);
  if(d===null) return '';
  if(d<0) return daysLabel(str);
  if(d<60) return daysLabel(str);
  const months = Math.round(d/30.44);
  return `~${months} month${months===1?'':'s'} left`;
}
function lastVisitDate(a){
  const log = a.visitLog||[];

  return [...log].sort((x,y)=>y.date.localeCompare(x.date))[0].date;

function mapsAddress(a){ return a.address ? a.address : `${a.city}, ${a.state}`; }
function mapsSingleUrl(a){ return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(mapsAddress(a))}`; }

const SUPABASE_URL = 'https://ibmuskjywznaplwohonc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlibXVza2p5d3puYXBsd29ob25jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NzI3NzMsImV4cCI6MjEwNTE0ODc3M30.FsaFAx3jcDQwyruI2NaclTn9jiWn-erCy_Q8chEcKvs';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;

let saveTimer = null;
let dbWriteInFlight = false;
let dbWriteQueued = false;

function setSaveStatus(text){
  const el = document.getElementById('saveStatus');
  if(el) el.textContent = text;
}

async function dbSetNow(){
  if(dbWriteInFlight){ dbWriteQueued = true; return; }
  dbWriteInFlight = true;
  setSaveStatus('Syncing…');
  try{
    const { error } = await sb.from('dashboard_data').upsert({
      user_id: currentUser.id,
      data: state.data,
      updated_at: new Date().toISOString(),
    });
    if(error) throw error;
    setSaveStatus('Synced');
  }catch(e){
    setSaveStatus('Sync failed — will retry next change');
    console.error('supabase save error', e);
  }
  dbWriteInFlight = false;
  if(dbWriteQueued){ dbWriteQueued = false; dbSetNow(); }
}

function persistNow(){
  state.data.updatedAt = new Date().toISOString();
  dbSetNow();
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 150);
}

async function loadFromSupabase(){
  try{
    const { data: row, error } = await sb.from('dashboard_data').select('data').eq('user_id', currentUser.id).maybeSingle();
    if(error) throw error;
    if(row && row.data && Array.isArray(row.data.accounts)){
      state.data = row.data;
    } else {
      seedData();
      await sb.from('dashboard_data').upsert({ user_id: currentUser.id, data: state.data, updated_at: new Date().toISOString() });
    }
  }catch(e){
    console.error('supabase load error', e);
    seedData();
  }
  render();
}

function niceDateTime(iso){

  return d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}

function downloadBackup(){
  clearTimeout(saveTimer);
  persistNow();
  const jsonStr = JSON.stringify(state.data, null, 2);
  const blob = new Blob([jsonStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'warpath-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function restoreBackup(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!(parsed && Array.isArray(parsed.accounts) && Array.isArray(parsed.tasks))){
        state.ui.backupError = "That file doesn't look like a dashboard file.";
        state.ui.pendingRestore = null;
        render();
        return;
      }
      const currentTime = state.data.updatedAt ? new Date(state.data.updatedAt).getTime() : 0;
      const fileTime = parsed.updatedAt ? new Date(parsed.updatedAt).getTime() : 0;
      if(currentTime && fileTime && fileTime < currentTime){
        state.ui.pendingRestore = parsed;
        state.ui.backupError = null;
        render();
      } else {
        applyRestore(parsed);
      }
    }catch(err){
      state.ui.backupError = "Couldn't read that file.";
      render();
    }
  };
  reader.readAsText(file);
}
function applyRestore(parsed){
  state.data = parsed;
  persistNow();
  state.ui.modal = null;
  state.ui.pendingRestore = null;
  state.ui.backupError = null;
  render();
}

const CSV_COLUMNS = ['Name','City','State','Address','Status','Priority','Renewal Date','CSM','Notes'];
function csvEscape(val){
  const s = (val==null ? '' : String(val));
  return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}
function accountsToCsv(){
  const rows = [CSV_COLUMNS.join(',')];
  state.data.accounts.forEach(a=>{
    rows.push([a.name, a.city, a.state, a.address||'', a.status, a.priority, a.renewalDate||'', csmName(a.csmId), a.notes||''].map(csvEscape).join(','));
  });
  return rows.join('\n');
}
function exportAccountsCsv(){
  const csv = accountsToCsv();
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'accounts.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; }
      } else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n' || c==='\r'){
        if(c==='\r' && text[i+1]==='\n') i++;
        row.push(field); field='';
        if(row.length>1 || row[0]!==''){ rows.push(row); }
        row = [];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).map(r=>{
    const obj = {};
    headers.forEach((h,i)=> obj[h] = (r[i]||'').trim());
    return obj;
  });
}

/* ================= TASKS ================= */
function tasksHTML(){
  const open = state.data.tasks.filter(t=>!t.done);
  const doneAll = state.data.tasks.filter(t=>t.done).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));
  const needsLog = doneAll.filter(t=>!t.loggedToSF);
  const logged = doneAll.filter(t=>t.loggedToSF);
  const overdue = open.filter(t=>daysUntil(t.dueDate)<0).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const soon = open.filter(t=>daysUntil(t.dueDate)>=0 && daysUntil(t.dueDate)<=7).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const later = open.filter(t=>daysUntil(t.dueDate)>7 || t.dueDate==null).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));

  return `
    <button class="btn primary fab-add" onclick="openTaskModal('new')">+ Add task</button>
    ${taskGroup('Overdue', overdue)}
    ${taskGroup('Due this week', soon)}
    ${taskGroup('Later', later)}
    ${needsLog.length? `
      <div class="task-group">
        <div class="section-title">Completed — log in Salesforce (${needsLog.length})</div>
        ${needsLog.map(t=>taskRow(t)).join('')}
      </div>
    `: ''}
    ${logged.length? `
      <div class="task-group">
        <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
          <span>Logged to Salesforce (${logged.length})</span>
          <a class="linklike" style="font-size:12px;" onclick="confirmDelete('clearCompleted','all')">${state.ui.deleteConfirm && state.ui.deleteConfirm.id==='all' ? 'Tap again to clear':'Clear these'}</a>
        </div>
        ${logged.map(t=>taskRow(t)).join('')}
      </div>
    `: ''}
  `;
}
function taskGroup(title, list){
  if(!list.length) return '';
  return `<div class="task-group">
    <div class="section-title">${title}</div>
    ${list.map(t=>taskRow(t)).join('')}
  </div>`;
}
function taskRow(t){
  const acc = t.accountId? getAccount(t.accountId): null;
  const overdue = !t.done && daysUntil(t.dueDate)<0;
  const meta = t.done
    ? `${acc? esc(acc.name)+' · ':''}Completed ${t.completedAt? niceDate(t.completedAt) : '— date not recorded'}`
    : `${acc? esc(acc.name)+' · ':''}${t.dueDate? niceDate(t.dueDate)+' · '+daysLabel(t.dueDate) : 'No due date'} · ${t.priority}`;
  const sfToggle = t.done ? `
    <label style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);margin-top:5px;" onclick="event.stopPropagation();">
      <input type="checkbox" style="width:14px;height:14px;accent-color:var(--amber-deep);" ${t.loggedToSF?'checked':''} onchange="toggleLoggedSF('${t.id}')" />
      Logged to Salesforce
    </label>` : '';
  return `<div class="task-row ${t.done?'done':''}">
    <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')" />
    <div class="task-main" onclick="openTaskModal('${t.id}')">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-meta ${overdue?'overdue':''}">${meta}</div>
      ${sfToggle}
    </div>
    <button class="btn ghost small" onclick="confirmDelete('task','${t.id}')">${state.ui.deleteConfirm && state.ui.deleteConfirm.id===t.id ? 'Confirm?':'✕'}</button>
  </div>`;
}
function toggleTask(id){
  const t = state.data.tasks.find(x=>x.id===id);
  t.done = !t.done;
  t.completedAt = t.done ? fmtDate(today()) : null;
  if(!t.done) t.loggedToSF = false;
  save(); render();
}
function toggleLoggedSF(id){
  const t = state.data.tasks.find(x=>x.id===id);
  t.loggedToSF = !t.loggedToSF;
  save(); render();
}

/* ================= DELETE CONFIRM (no native dialogs) ================= */
function confirmDelete(type,id){
  if(state.ui.deleteConfirm && state.ui.deleteConfirm.type===type && state.ui.deleteConfirm.id===id){
    if(type==='account') state.data.accounts = state.data.accounts.filter(a=>a.id!==id);
    if(type==='task') state.data.tasks = state.data.tasks.filter(t=>t.id!==id);
    if(type==='clearCompleted') state.data.tasks = state.data.tasks.filter(t=>!t.done);
    if(type==='csm'){
      state.data.csms = state.data.csms.filter(c=>c.id!==id);
      state.data.accounts.forEach(a=>{ if(a.csmId===id) a.csmId=null; });
      state.ui.modal = null;
    }
    if(type==='csmRequest'){ state.data.csmRequests = state.data.csmRequests.filter(r=>r.id!==id); state.ui.modal = null; }
    state.ui.deleteConfirm = null;
    save(); render();
  } else {
    state.ui.deleteConfirm = {type,id};
    if(type==='account') renderAccountsList(); else render();
    setTimeout(()=>{ if(state.ui.deleteConfirm && state.ui.deleteConfirm.id===id){ state.ui.deleteConfirm=null; if(type==='account') renderAccountsList(); else render(); } }, 3000);
  }
}

      <p style="font-size:12px;color:var(--muted-2);">Last synced: ${niceDateTime(state.data.updatedAt)}</p>
      <button class="btn primary fab-add" onclick="downloadBackup()">Save a backup file</button>

      <div class="section-title" style="margin-top:16px;">Restore from a backup file</div>
      <div class="field">
        <input type="file" accept="application/json" onchange="restoreBackup(this)" />
      </div>
      <p style="font-size:12px;color:var(--muted-2);margin:0;">Only needed if you're recovering from an old export — not part of normal use.</p>

      ${state.ui.pendingRestore ? `
        <div style="background:var(--amber-bg);border-radius:8px;padding:11px;margin:10px 0;">
          <div style="font-size:12.5px;color:#6B4A1E;">This file is older (${niceDateTime(state.ui.pendingRestore.updatedAt)}) than what's currently synced. Loading it will overwrite the newer data.</div>
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="btn small danger" onclick="applyRestore(state.ui.pendingRestore)">Load anyway</button>
            <button class="btn small" onclick="cancelRestore()">Cancel</button>
          </div>
        </div>
      ` : ''}

      ${state.ui.backupError ? `<div style="color:var(--red);font-size:12.5px;margin-top:8px;">${esc(state.ui.backupError)}</div>` : ''}
    </div>
  </div>`;
}
let editingProducts = [];
let editingVisits = [];
let editingMarketing = [];
function accountModal(){
  const isNew = state.ui.modal.id==='new';
  const a = isNew ? { name:'',city:'',state:'MD',address:'',status:'Healthy',priority:'Medium',renewalDate:'',nextVisit:'',notes:'',products:[],visitLog:[],marketing:[],csmId:null,planning:{} } : getAccount(state.ui.modal.id);
  editingProducts = (a.products || []).map(p=>({...p}));
  editingVisits = (a.visitLog || []).map(v=>({...v}));
  editingMarketing = (a.marketing || []).map(m=>({...m}));
  return `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-close"><button class="btn ghost small" onclick="closeModal()">Close ✕</button></div>
      <h2>${isNew?'Add account':'Edit account'}</h2>
      <div class="field"><label>Dealer / account name</label><input id="f_name" value="${esc(a.name)}" data-autofocus /></div>
      <div class="row2">
        <div class="field"><label>City</label><input id="f_city" value="${esc(a.city)}" /></div>
        <div class="field"><label>State</label><select id="f_state">${STATES.map(s=>`<option ${a.state===s?'selected':''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Street address (for directions — optional, falls back to city/state)</label><input id="f_address" value="${esc(a.address||'')}" placeholder="123 Main St, Frederick, MD 21701" /></div>
      <div class="field"><label>CSM assigned</label>
        <select id="f_csm"><option value="">— Unassigned —</option>${state.data.csms.map(c=>`<option value="${c.id}" ${a.csmId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      </div>
      <div class="row2">
        <div class="field"><label>Status</label><select id="f_status">${STATUSES.map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="field"><label>Priority</label><select id="f_priority">${PRIORITIES.map(p=>`<option ${a.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Renewal date</label><input type="date" id="f_renewal" value="${a.renewalDate||''}" /></div>
        <div class="field"><label>Next visit (plan — reschedule anytime)</label><input type="date" id="f_next" value="${a.nextVisit||''}" /></div>
      </div>
      <div class="field"><label>Notes / engagement plan</label><textarea id="f_notes" rows="3">${esc(a.notes)}</textarea></div>

      <div class="section-title">Account planning</div>
      <p style="font-size:12px;color:var(--muted-2);margin:-4px 0 8px;">Strengths and weaknesses by department — use this to prep for reviews and find the next opening.</p>
      ${DEPARTMENTS.map(dept => `
        <div style="font-size:13px;font-weight:600;margin:12px 0 6px;">${dept}</div>
        <div class="field"><label>Strengths</label><textarea id="f_plan_${dept}_s" rows="2">${esc((a.planning && a.planning[dept] && a.planning[dept].strengths) || '')}</textarea></div>
        <div class="field"><label>Weaknesses</label><textarea id="f_plan_${dept}_w" rows="2">${esc((a.planning && a.planning[dept] && a.planning[dept].weaknesses) || '')}</textarea></div>
      `).join('')}

      <div class="section-title">Products they have</div>
      <p style="font-size:12px;color:var(--muted-2);margin:-4px 0 8px;">Log their DMS, CRM, Service, and anything else worth tracking — ours or a competitor's.</p>
      <div id="productsListEditor">${productsListEditorHTML()}</div>
      <div class="row2" style="margin-top:6px;">
        <div class="field"><label>Category</label><select id="np_cat">${PRODUCT_CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="field"><label>Vendor</label><select id="np_vendor">${VENDORS.map(v=>`<option>${v}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Product name</label><input id="np_name" placeholder="e.g. CDK CRM, VinSolutions, Xtime…" /></div>
      <button type="button" class="btn small" onclick="addEditingProduct()">+ Add product</button>

      <div class="section-title">Visit history</div>
      <p style="font-size:12px;color:var(--muted-2);margin:-4px 0 8px;">Every completed visit stays here permanently — use it to log mileage into your reimbursement app.</p>
      <div id="visitsListEditor">${visitsListEditorHTML()}</div>
      <div class="row2" style="margin-top:6px;">
        <div class="field"><label>Date</label><input type="date" id="nv_date" value="${fmtDate(today())}" /></div>
      </div>
      <div class="field"><label>Notes</label><input id="nv_notes" placeholder="What happened on this visit…" /></div>
      <button type="button" class="btn small" onclick="addEditingVisit()">+ Add visit</button>

      <div class="section-title">Marketing sent</div>
      <p style="font-size:12px;color:var(--muted-2);margin:-4px 0 8px;">Track what you've sent them — flyers, one-pagers, promos.</p>
      <div id="marketingListEditor">${marketingListEditorHTML()}</div>
      <div class="row2" style="margin-top:6px;">
        <div class="field"><label>Date</label><input type="date" id="nm_date" value="${fmtDate(today())}" /></div>
        <div class="field"><label>Item sent</label><input id="nm_item" placeholder="e.g. Q4 promo flyer" /></div>
      </div>
      <button type="button" class="btn small" onclick="addEditingMarketing()">+ Add marketing entry</button>

      <button class="btn primary fab-add" style="margin-top:16px;" onclick="saveAccountForm('${isNew?'new':a.id}')">Save account</button>
    </div>
  </div>`;
}
function productsListEditorHTML(){
  if(!editingProducts.length) return `<div class="empty" style="padding:4px 0;">No products logged yet.</div>`;
  return editingProducts.map((p,i)=>`
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-soft);">
      <span class="badge vendor-${p.vendor}">${p.category}: ${esc(p.name)}</span>
      <button type="button" class="btn ghost small" onclick="removeEditingProduct(${i})">✕</button>
    </div>
  `).join('');
}
function addEditingProduct(){
  const cat = document.getElementById('np_cat').value;
  const vendor = document.getElementById('np_vendor').value;
  const name = document.getElementById('np_name').value.trim();
  if(!name) return;
  editingProducts.push({ id: uid(), category: cat, name, vendor });
  document.getElementById('np_name').value = '';
  document.getElementById('productsListEditor').innerHTML = productsListEditorHTML();
}
function visitsListEditorHTML(){
  if(!editingVisits.length) return `<div class="empty" style="padding:4px 0;">No visits logged yet.</div>`;
  return [...editingVisits].sort((a,b)=>b.date.localeCompare(a.date)).map((v)=>{
    const i = editingVisits.indexOf(v);
    return `
    <div style="padding:7px 0;border-bottom:1px solid var(--line-soft);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div>
          <div style="font-weight:600;font-size:13px;">${niceDate(v.date)}</div>
          ${v.notes? `<div style="font-size:12px;color:var(--muted);margin-top:2px;">${esc(v.notes)}</div>`:''}
        </div>
        <button type="button" class="btn ghost small" onclick="removeEditingVisit(${i})">✕</button>
      </div>
      <label style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);margin-top:5px;">
        <input type="checkbox" style="width:14px;height:14px;accent-color:var(--amber-deep);" ${v.loggedMileage?'checked':''} onchange="toggleEditingVisitLogged(${i})" />
        Logged in mileage app
      </label>
    </div>
  `;}).join('');
}
function addEditingVisit(){
  const date = document.getElementById('nv_date').value || fmtDate(today());
  const notes = document.getElementById('nv_notes').value.trim();
  editingVisits.push({ id: uid(), date, notes, loggedMileage:false });
  document.getElementById('nv_notes').value = '';
  document.getElementById('visitsListEditor').innerHTML = visitsListEditorHTML();
}
function removeEditingVisit(i){
  editingVisits.splice(i,1);
  document.getElementById('visitsListEditor').innerHTML = visitsListEditorHTML();
}
function toggleEditingVisitLogged(i){
  editingVisits[i].loggedMileage = !editingVisits[i].loggedMileage;
  document.getElementById('visitsListEditor').innerHTML = visitsListEditorHTML();
}
function marketingListEditorHTML(){
  if(!editingMarketing.length) return `<div class="empty" style="padding:4px 0;">Nothing logged yet.</div>`;
  return [...editingMarketing].sort((a,b)=>b.date.localeCompare(a.date)).map((m)=>{
    const i = editingMarketing.indexOf(m);
    return `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-soft);">
      <div style="font-size:13px;">${esc(m.item)} <span style="color:var(--muted-2);font-size:11.5px;">· ${niceDate(m.date)}</span></div>
      <button type="button" class="btn ghost small" onclick="removeEditingMarketing(${i})">✕</button>
    </div>
  `;}).join('');
}
function addEditingMarketing(){
  const date = document.getElementById('nm_date').value || fmtDate(today());
  const item = document.getElementById('nm_item').value.trim();
  if(!item) return;
  editingMarketing.push({ id: uid(), date, item });
  document.getElementById('nm_item').value = '';
  document.getElementById('marketingListEditor').innerHTML = marketingListEditorHTML();
}
function removeEditingMarketing(i){
  editingMarketing.splice(i,1);
  document.getElementById('marketingListEditor').innerHTML = marketingListEditorHTML();
}
function removeEditingProduct(i){
  editingProducts.splice(i,1);
  document.getElementById('productsListEditor').innerHTML = productsListEditorHTML();
}
function saveAccountForm(id){
  const planning = {};
  DEPARTMENTS.forEach(dept=>{
    planning[dept] = {
      strengths: document.getElementById(`f_plan_${dept}_s`).value.trim(),
      weaknesses: document.getElementById(`f_plan_${dept}_w`).value.trim(),
    };
  });
  const vals = {
    name: document.getElementById('f_name').value.trim(),
    city: document.getElementById('f_city').value.trim(),
    state: document.getElementById('f_state').value,
    address: document.getElementById('f_address').value.trim(),
    csmId: document.getElementById('f_csm').value || null,
    status: document.getElementById('f_status').value,
    priority: document.getElementById('f_priority').value,
    renewalDate: document.getElementById('f_renewal').value || null,
    nextVisit: document.getElementById('f_next').value || null,
    notes: document.getElementById('f_notes').value.trim(),
    products: editingProducts,
    visitLog: editingVisits,
    marketing: editingMarketing,
    planning: planning,
  };
  if(!vals.name){ document.getElementById('f_name').style.borderColor = 'var(--red)'; return; }
  if(id==='new'){
    state.data.accounts.push({ id: uid(), ...vals });
  } else {
    Object.assign(getAccount(id), vals);
  }
  save();
  state.ui.modal = null;
  render();
}
function taskModal(){
  const isNew = state.ui.modal.id==='new';
  const t = isNew ? { title:'', accountId:'', dueDate:'', priority:'Medium', done:false } : state.data.tasks.find(x=>x.id===state.ui.modal.id);
  return `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-close"><button class="btn ghost small" onclick="closeModal()">Close ✕</button></div>
      <h2>${isNew?'Add task':'Edit task'}</h2>
      <div class="field"><label>Task</label><input id="t_title" value="${esc(t.title)}" data-autofocus /></div>
      <div class="field"><label>Related account (optional)</label>
        <select id="t_account"><option value="">— None —</option>${state.data.accounts.map(a=>`<option value="${a.id}" ${t.accountId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
      </div>
      <div class="row2">
        <div class="field"><label>Due date</label><input type="date" id="t_due" value="${t.dueDate||''}" /></div>
        <div class="field"><label>Priority</label><select id="t_priority">${PRIORITIES.map(p=>`<option ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>
      </div>
      <button class="btn primary fab-add" onclick="saveTaskForm('${isNew?'new':t.id}')">Save task</button>
    </div>
  </div>`;
}
function saveTaskForm(id){
  const vals = {
    title: document.getElementById('t_title').value.trim(),
    accountId: document.getElementById('t_account').value || null,
    dueDate: document.getElementById('t_due').value || null,
    priority: document.getElementById('t_priority').value,
  };
  if(!vals.title){ document.getElementById('t_title').style.borderColor='var(--red)'; return; }
  if(id==='new'){
    state.data.tasks.push({ id: uid(), done:false, loggedToSF:false, ...vals });
  } else {
    Object.assign(state.data.tasks.find(x=>x.id===id), vals);
  }
  save();
  state.ui.modal = null;
  render();
}

function esc(s){ const d=document.createElement('div'); d.innerText = s==null? '' : s; return d.innerHTML; }

load();
</script>
</body>
</html>
